<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
  <title id="t">Dakshay Ahuja, Site Reliability Engineer II at Zeta</title>
  <desc id="d">A terminal window. whoami prints the name and role. systemctl shows reliability as active. cat now.md says: deep in multi-region disaster recovery for production systems, drills until losing a region is boring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 24px; fill: #c9d1d9; }
      .user { fill: #3fb950; font-weight: 600; }
      .path { fill: #58a6ff; font-weight: 600; }
      .dim  { fill: #8b949e; }
      .ok   { fill: #3fb950; }
      .hi   { fill: #f0f6fc; }
      .name { font-size: 46px; font-weight: 700; fill: #f0f6fc; }
      .role { font-size: 24px; fill: #58a6ff; }
      .ttl  { font-size: 16px; fill: #8b949e; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes blink { 50% { fill-opacity: 0; } }
      @keyframes pulse { 50% { fill-opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="598" height="598" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="46" rx="15" fill="#161b22"/>
  <rect x="2" y="32" width="596" height="16" fill="#161b22"/>
  <line x1="2" y1="48" x2="598" y2="48" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="30" cy="25" r="8" fill="#ff5f57"/>
  <circle cx="56" cy="25" r="8" fill="#febc2e"/>
  <circle cx="82" cy="25" r="8" fill="#28c840"/>
  <text x="300" y="31" text-anchor="middle" class="ttl">dakshay@prod: ~</text>
  <rect x="0" y="596" width="600" height="4" rx="2" fill="url(#glow)" opacity=".8"/>

  <text x="36" y="98"><tspan class="user">$</tspan> whoami</text>
  <text x="36" y="158" class="name">Dakshay Ahuja</text>
  <text x="36" y="196" class="role">SRE II @ Zeta</text>

  <text x="36" y="258"><tspan class="user">$</tspan> systemctl status reliability</text>
  <text x="36" y="294"><tspan class="ok pulse">●</tspan> <tspan class="ok">active (running)</tspan></text>

  <text x="36" y="356"><tspan class="user">$</tspan> cat now.md</text>
  <text x="36" y="394" class="hi">Deep in multi-region disaster</text>
  <text x="36" y="426" class="hi">recovery for production systems.</text>
  <text x="36" y="462" class="dim">Drills until losing a region</text>
  <text x="36" y="494" class="dim">is boring.</text>

  <text x="36" y="556"><tspan class="user">$</tspan> <tspan class="cursor">▋</tspan></text>
</svg>
