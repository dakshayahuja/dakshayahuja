  <text x="599" y="218" text-anchor="middle" class="mono tag" fill="#79c0ff">gitops</text>
  <text x="654" y="219" class="sans item">Chasing ArgoCD drift before a resync undoes a hotfix</text>

  <rect x="560" y="244" width="78" height="26" rx="13" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="599" y="262" text-anchor="middle" class="mono tag" fill="#56d364">nodes</text>
  <text x="654" y="263" class="sans item">Working out why Karpenter won't bring up nodes</text>

