  <circle cx="28" cy="23" r="7" fill="#30363d"/><circle cx="52" cy="23" r="7" fill="#30363d"/><circle cx="76" cy="23" r="7" fill="#30363d"/>
  <text x="600" y="28" text-anchor="middle" class="mono ttl">~/about.md</text>

  <!-- lead -->
  <rect x="40" y="76" width="4" height="34" rx="2" fill="#3fb950"/>
  <text x="58" y="100" class="sans lead">I like understanding how systems fit together, finding out why they break, and making the next fix easier.</text>

  <line x1="40" y1="138" x2="1160" y2="138" stroke="#30363d" stroke-width="1.5"/>

  <!-- what I do -->
  <text x="40" y="176" class="mono h"><tspan fill="#3fb950">$</tspan> what-i-do</text>

  <circle cx="48" cy="216" r="5" fill="#58a6ff"/>
  <text x="66" y="222" class="sans item">Cloud infrastructure</text>
  <text x="66" y="244" class="sans sub">AWS, GCP, Kubernetes</text>

  <circle cx="48" cy="276" r="5" fill="#d29922"/>
  <text x="66" y="282" class="sans item">Automation</text>
  <text x="66" y="304" class="sans sub">Infrastructure as code, GitOps, pipelines</text>

  <circle cx="48" cy="336" r="5" fill="#3fb950"/>
  <text x="66" y="342" class="sans item">Reliability</text>
  <text x="66" y="364" class="sans sub">Observability, incident response, disaster recovery</text>

  <line x1="520" y1="160" x2="520" y2="372" stroke="#30363d" stroke-width="1.5"/>

  <!-- lately -->
  <text x="560" y="176" class="mono h"><tspan fill="#3fb950">$</tspan> history | tail -n 4</text>

