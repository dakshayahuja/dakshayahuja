<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">About Dakshay</title>
  <desc id="d">I like understanding how systems fit together, finding out why they break, and making the next fix easier. What I do: cloud infrastructure on AWS, GCP and Kubernetes; automation with infrastructure as code, GitOps and pipelines; reliability through observability, incident response and disaster recovery. Lately: chasing ArgoCD drift before a resync quietly undoes a hotfix; working out why Karpenter won't bring up new nodes; fixing HPAs stuck on unknown targets; turning a one-off fix into a script, then a pipeline, then a runbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lead { font-size: 22px; fill: #f0f6fc; font-weight: 500; }
      .h    { font-size: 15px; fill: #8b949e; }
      .item { font-size: 18px; fill: #e6edf3; }
      .sub  { font-size: 15px; fill: #8b949e; }
      .tag  { font-size: 13px; font-weight: 600; }
      .ttl  { font-size: 14px; fill: #8b949e; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="42" rx="13" fill="#161b22"/>
  <rect x="2" y="30" width="1196" height="14" fill="#161b22"/>
