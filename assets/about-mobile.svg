  <rect x="32" y="80" width="5" height="110" rx="2.5" fill="#3fb950"/>
  <text x="54" y="106" class="sans lead">I like understanding how systems</text>
  <text x="54" y="142" class="sans lead">fit together, finding out why they</text>
  <text x="54" y="178" class="sans lead">break, and making the next fix easier.</text>

  <line x1="32" y1="218" x2="568" y2="218" stroke="#30363d" stroke-width="1.5"/>

  <text x="32" y="260" class="mono h"><tspan fill="#3fb950">$</tspan> what-i-do</text>
  <circle cx="42" cy="296" r="6" fill="#58a6ff"/>
  <text x="62" y="304" class="sans item">Cloud infrastructure</text>
  <text x="62" y="332" class="sans sub">AWS, GCP, Kubernetes</text>
  <circle cx="42" cy="372" r="6" fill="#d29922"/>
  <text x="62" y="380" class="sans item">Automation</text>
  <text x="62" y="408" class="sans sub">IaC, GitOps, pipelines</text>
  <circle cx="42" cy="448" r="6" fill="#3fb950"/>
  <text x="62" y="456" class="sans item">Reliability</text>
  <text x="62" y="484" class="sans sub">Observability, incidents, disaster recovery</text>

  <line x1="32" y1="520" x2="568" y2="520" stroke="#30363d" stroke-width="1.5"/>

  <text x="32" y="562" class="mono h"><tspan fill="#3fb950">$</tspan> history | tail -n 4</text>

