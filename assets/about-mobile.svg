<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d">
  <title id="t">About Dakshay</title>
  <desc id="d">I like understanding how systems fit together, finding out why they break, and making the next fix easier. What I do: cloud infrastructure, automation, reliability. Lately: ArgoCD drift, Karpenter nodes, HPA unknown targets, and turning one-off fixes into runbooks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lead { font-size: 27px; fill: #f0f6fc; font-weight: 500; }
      .h    { font-size: 20px; fill: #8b949e; }
      .item { font-size: 25px; fill: #e6edf3; }
      .sub  { font-size: 20px; fill: #8b949e; }
      .tag  { font-size: 17px; font-weight: 600; }
      .ttl  { font-size: 17px; fill: #8b949e; }
    </style>
  </defs>

  <rect x="1" y="1" width="598" height="898" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="46" rx="15" fill="#161b22"/>
  <rect x="2" y="32" width="596" height="16" fill="#161b22"/>
